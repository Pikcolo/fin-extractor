[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-extractor"
version = "0.1.0"
description = "OCR + Information Extraction สำหรับเอกสารการเงิน (ใบกำกับภาษี / ใบเสร็จ / Invoice)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    # contrib ไม่ใช่ headless: paddlex (ที่ PaddleOCR ใช้) บังคับ opencv-contrib-python==4.10.0.84
    # ถ้าลง headless คู่กัน สองแพ็กเกจจะเขียนลงโฟลเดอร์ cv2 เดียวกันแล้วชนกัน
    "opencv-contrib-python>=4.10",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# OCR หลัก — ต้องลง paddlepaddle-gpu (หรือ paddlepaddle รุ่น CPU) แยกก่อน ดู docs/06-usage.md
# ไม่ใส่ paddlepaddle ไว้ตรงนี้ เพราะรุ่น CPU กับ GPU ใช้ชื่อโมดูลเดียวกัน ลงซ้อนกันแล้วชน
# 3.2 ขึ้นไปถึงจะมีโมเดลภาษาไทย (th_PP-OCRv5_mobile_rec)
paddle = ["paddleocr>=3.2"]
vlm = ["httpx>=0.27", "openai>=1.40"]
dev = ["pytest>=8.0"]
all = ["fin-extractor[paddle,vlm,dev]"]

[project.scripts]
fin-extractor = "fin_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
