# หนังสือรับรองการหักภาษี ณ ที่จ่าย ตามมาตรา 50 ทวิ
# Ratios [x0, y0, x1, y1] are fractions of the CONTENT bbox of the normalized page
# (top = "ฉบับที่ 1" line, bottom = "หมายเหตุ" footnote). Measured on 001307/001321,
# checked on 001311/001323 (scripts/ratio_grid.py used for this is not part of this repo).
#
# Ratios use the content bbox, not the ruled form border: the border is often broken in scans.

options:
  mode: template

regions:
  - name: doc_header          # เล่มที่ / เลขที่ (certificate number)
    box: [0.00, 0.000, 1.00, 0.085]
    hint: book_no, cert_no
  - name: payer               # ผู้มีหน้าที่หักภาษี ณ ที่จ่าย
    box: [0.00, 0.085, 1.00, 0.160]
    hint: payer_tax_id, payer_name, payer_address
  - name: payee               # ผู้ถูกหักภาษี ณ ที่จ่าย
    box: [0.00, 0.160, 1.00, 0.245]
    hint: payee_tax_id, payee_name, payee_address
  - name: form_type           # ลำดับที่ + ภ.ง.ด. checkboxes
    box: [0.00, 0.240, 1.00, 0.290]
    hint: pnd_form (checked box)

  # ตารางรายได้เป็น region เดียวทั้งแถว (ป้าย | วันที่ | จำนวนเงิน | ภาษี อยู่ภาพเดียวกัน)
  # เดิม preprocess_finance แยก 4 คอลัมน์ (income_desc/date/amount/tax) วัดกับ OpenThai แล้วแย่ลง: ภาพคอลัมน์ตัวเลขไม่มีป้าย
  # โมเดลตอบเป็นตารางว่างยาว และ rules หายอดรวมไม่เจอ (docs/03-regions.md) — กรอบนี้คือขอบเขตรวมของ 4 คอลัมน์เดิม
  # สูงเกิน max_piece_frac จึงถูกตัดเป็นท่อนที่แถวว่าง (ตัดตามแถว ไม่ตัดตามคอลัมน์)
  - name: income_table
    box: [0.00, 0.285, 1.00, 0.765]
    hint: income type rows 1-6 + pay_date + amount_paid + tax_withheld (+ total row)

  - name: total_text          # รวมเงินภาษีที่หักนำส่ง (ตัวอักษร)
    box: [0.00, 0.760, 1.00, 0.795]
    hint: total_tax_in_words
  - name: fund_contrib        # เงินที่จ่ายเข้า กบข./ประกันสังคม/กองทุนสำรองฯ
    box: [0.00, 0.790, 1.00, 0.818]
  - name: payer_method        # ผู้จ่ายเงิน: หัก ณ ที่จ่าย / ออกให้ตลอดไป / ...
    box: [0.00, 0.812, 1.00, 0.842]
    hint: payment condition checkbox
  - name: issue_date          # วัน เดือน ปี ที่ออกหนังสือรับรอง (below the signature line)
    box: [0.42, 0.915, 0.75, 0.960]
    hint: issue_date

# Areas blanked before export: not needed for field extraction and they confuse OCR.
ignore:
  - name: signature           # ลงชื่อ ... ผู้จ่ายเงิน
    box: [0.42, 0.875, 0.78, 0.915]
  - name: stamp               # ตราประทับบริษัท
    box: [0.77, 0.850, 0.99, 0.935]
