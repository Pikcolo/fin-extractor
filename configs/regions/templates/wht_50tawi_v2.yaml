# หนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ) — alternate print layout
# (serif font, "เลขประจำตัวประชาชน" lines, เงินสะสม/ประกันสังคม block below the payer row).
# Same document type as wht_50tawi but different row positions -> separate template.
# Measured on 001311 (content anchor).

options:
  mode: template

regions:
  - name: doc_header
    box: [0.00, 0.000, 1.00, 0.090]
    hint: book_no, cert_no
  - name: payer
    box: [0.00, 0.090, 1.00, 0.180]
    hint: payer_tax_id, payer_name, payer_address
  - name: payee
    box: [0.00, 0.180, 1.00, 0.275]
    hint: payee_tax_id, payee_name, payee_address
  - name: form_type
    box: [0.00, 0.270, 1.00, 0.325]
    hint: pnd_form (checked box)

  # ตารางรายได้เป็น region เดียวทั้งแถว (ป้าย | วันที่ | จำนวนเงิน | ภาษี อยู่ภาพเดียวกัน)
  # เดิม preprocess_finance แยก 4 คอลัมน์ (income_desc/date/amount/tax) วัดกับ OpenThai แล้วแย่ลง: ภาพคอลัมน์ตัวเลขไม่มีป้าย
  # โมเดลตอบเป็นตารางว่างยาว และ rules หายอดรวมไม่เจอ (docs/03-regions.md) — กรอบนี้คือขอบเขตรวมของ 4 คอลัมน์เดิม
  # สูงเกิน max_piece_frac จึงถูกตัดเป็นท่อนที่แถวว่าง (ตัดตามแถว ไม่ตัดตามคอลัมน์)
  - name: income_table
    box: [0.00, 0.325, 1.00, 0.805]
    hint: income type rows 1-6 + pay_date + amount_paid + tax_withheld (+ total row)

  - name: total_text
    box: [0.00, 0.800, 1.00, 0.830]
    hint: total_tax_in_words
  - name: payer_method
    box: [0.00, 0.825, 1.00, 0.855]
  - name: fund_contrib
    box: [0.00, 0.850, 1.00, 0.905]
  - name: issue_date          # date line sits under the stamp on this layout; stamp ink may remain
    box: [0.50, 0.932, 0.90, 0.985]
    hint: issue_date

ignore:
  - name: signature
    box: [0.44, 0.905, 0.72, 0.932]
