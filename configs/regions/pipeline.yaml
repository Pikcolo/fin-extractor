# ค่าของโหมดแบ่ง region/ตาราง (python -m fin_extractor regions) — ขั้น 3 ทางเลือก ข้าง ๆ ผัง section เดิม
# ค่าทั้งหมดคัดลอกจาก learning/preprocess_finance/configs/pipeline.yaml ซึ่งวัดบนสแกนชุดเดียวกัน 18 ใบ
# ค่าเป็นพิกเซล (px) วัดที่ 200 dpi: ภาพ final (render 300 dpi) จึงถูกย่อเป็น ref_dpi ก่อนตรวจ แล้วตัดภาพจริงจากภาพ final สีความละเอียดเต็ม
# ลำดับความสำคัญ: defaults < template options < รายเอกสาร (doc_types.yaml)
# orient / deskew / ลบเส้นสกปรก ไม่อยู่ที่นี่: ทำแล้วในขั้น 2 (preprocess) ด้วยตัวจำแนกทิศของ Paddle ซึ่งแยก 90° กับ 270° ได้

ref_dpi: 200            # ความละเอียดที่ค่า px ทุกตัวในไฟล์นี้ถูกวัด (ภาพฝังใน PDF กว้าง 1632 px = A4 ที่ 200 dpi)

defaults:
  mode: template        # template | generic (template falls back to generic if no template file)
  anchor: content       # content | frame  — what region ratios are measured against
  clean: none           # none | suppress_color | max_channel
  use_lines: true       # use horizontal table rules (snap template edges / cut generic strips)
  mask_codes: true      # blank QR codes / barcodes before cutting regions (payload kept in manifest)

normalize:
  margin_frac: 0.01     # white margin kept around the content bbox (fraction of width)

mask:
  min_size_frac: 0.04          # candidate block must be >= 4% of page width
  qr_min_size_frac: 0.06
  qr_min_density: 0.45         # ink fraction; printed text blocks measure ~0.25-0.37
  barcode_min_vert_ratio: 3.0  # vertical / horizontal edge energy; text ~1-1.7

lines:
  min_len_frac: 0.25           # a rule must span >= 25% of page width (dotted leaders/short cell borders excluded)
  snap_tol_frac: 0.015         # template edge moves to a rule within 1.5% of page height
  snap_min_len_frac: 0.6       # only section dividers (>= 60% of frame width) are snap targets
  v_min_len_frac: 0.03         # vertical rule length, as a fraction of page WIDTH (> one character)

tables:                        # generic:lines pages only (template docs already name their columns)
  vline_cover: 0.7             # a column rule must cross >= 70% of a row's height
  col_tol_px: 15               # rows belong to one table when their column rules line up within this
  max_header_h: 140            # filled header bar (no visible rules) inherits columns if <= this tall
  header_bar_max_gray: 200     # ... and its median gray is below this (306 blue, 318 purple)
  split_row_min_h: 90          # body rows taller than this have no rules between items -> split
  row_gap_px: 6                # empty pixel rows that separate two items
  min_row_h: 12
  anchor_tol_px: 40            # item-no. column may start up to ~1 text line below the first text

regions:
  pad_frac: 0.006       # padding added around every region (fraction of frame height)
  frame_min_area_frac: 0.35

generic:
  strategy: lines          # lines | table | bands  (lines falls back to bands when < min_lines rules)
  min_lines: 3
  cut_min_len_frac: 0.30   # only rules this long become cuts; shorter-than-page rules are checked
                           # for text beside them (310: totals box on the right, notes on the left)
  cut_search_px: 12        # move a cut up/down this far to avoid slicing text beside a short rule
  min_strip_px: 30         # thinner strips (double rules) are merged into the next one
  min_strip_ink: 0.002     # drop empty strips (blank table rows)
  line_pad_px: 4
  table_min_w_frac: 0.5
  table_min_h_frac: 0.08
  table_max_h_frac: 0.92   # a "table" taller than this is the page border -> use bands instead
  band_gap_frac: 0.012     # min whitespace gap between bands (fraction of frame height)
  min_band_px: 25
  max_bands: 6

export:
  min_ink_frac: 0.002      # skip regions that are (almost) blank after masking
  trim: true               # shrink every crop to its text (+ trim_pad_px); empty -> skipped
  trim_pad_px: 6
  # วิธีเตรียมภาพ crop = ชื่อเดียวกับภาพ section (sections/images.py): color | luma | flat | bin
  # ค่าตั้งต้น luma เพราะวัดแล้วดีสุดกับ OpenThai บน 18 ใบ (docs/03-sections.md) ส่วน preprocess_finance ใช้ raw/gray/binary (ยังไม่ได้วัดกับ OCR)
  variants: [luma]
  cell_variants: [luma]
  # region ที่สูงเกินสัดส่วนนี้ของความสูงหน้าถูกตัดเป็นท่อนที่แถวว่าง (sections.layout.split_rows / MAX_PIECE_FRAC ที่วัดกับ OCR แล้ว)
  # แทน tile_max_h 900 px ของ preprocess_finance ซึ่งไม่ได้วัดกับ OCR — 0 = ไม่ตัด
  max_piece_frac: 0.3
