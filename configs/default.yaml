# ค่าตั้งต้นของ pipeline — override ได้ด้วย --config <file> หรือ env (.env)

paths:
  data_dir: data            # ข้อมูลทุกอย่างอยู่ใต้นี้ โครงดู src/fin_extractor/paths.py (ไม่ commit ทั้งหมด)
  # folders: {result_ocr: ocr_results}   # เปลี่ยนชื่อโฟลเดอร์ระดับบนได้ (ไม่บังคับ)

loader:
  pdf_dpi: 300            # ความละเอียดตอน render PDF เป็นภาพ

# Preprocessing ชุดเดียวใช้ทั้ง PaddleOCR และ VLM — ภาพสี ไม่ binarize
# เลือกจากการวัดกับชุดสังเคราะห์ (scripts/benchmark_preprocessing.py, ผลใน docs/02-preprocessing.md)
#   - ภาพสีอ่านค่าสำคัญได้ครบ ส่วนภาพเทาทำให้ตัวตรวจจับข้อความของ Paddle ไม่เจอบรรทัดในภาพสแกนบางใบ
#   - NL-means + CLAHE ช้า (เตรียมภาพ ~5 วิ/ใบ เทียบ ~0.2 วิ) และไม่ทำให้อ่านได้มากขึ้น
preprocessing:
  min_long_side: 1600     # upscale ถ้าภาพเล็กกว่านี้ (ยังไม่ได้วัดผลของขั้นนี้ — ชุดทดสอบใหญ่กว่าเกณฑ์อยู่แล้ว)
  fix_orientation: true   # หมุน 90/180/270 ด้วยตัวจำแนกทิศทั้งหน้าของ Paddle
  deskew: true
  max_skew_angle: 15.0
  denoise: none           # none | median | nlmeans | bilateral
  clahe: false
  binarize: none          # none | otsu | adaptive | sauvola
  remove_borders: false
  keep_color: true        # VLM อ่านภาพสีได้ดีกว่า และ Paddle เสถียรกว่าภาพเทา

ocr:
  paddle:
    lang: th               # → th_PP-OCRv5_mobile_rec (Paddle 3.2+)
    # ปิดตัวจำแนกทิศรายบรรทัด: มันตัดสินผิดว่าบรรทัดไทยกลับหัวแล้วหมุนกลับ
    # อ่านได้ "81-SO-EZOZ" แทน "2023-05-18" (BITKUB-001 เพี้ยน 3 จาก 28 บรรทัด)
    # ทิศของทั้งหน้าตรวจแล้วใน preprocessing (ตัวจำแนกทิศทั้งหน้าของ Paddle)
    use_angle_cls: false

vlm:
  # provider: ollama  → Ollama native API (ตั้ง num_ctx ได้)       base_url: http://localhost:11434
  # provider: openai  → OpenAI-compatible endpoint:
  #     vLLM (local)  : http://localhost:8000/v1      model: ชื่อ HF repo ที่ serve
  #     Typhoon API   : https://api.opentyphoon.ai/v1  (ตั้ง TYPHOON_API_KEY, เช็คชื่อ model ที่ docs.opentyphoon.ai)
  provider: ollama
  base_url: http://localhost:11434
  model: scb10x/typhoon-ocr1.5-3b
  api_key_env: TYPHOON_API_KEY   # ใช้เฉพาะ provider openai
  temperature: 0.1
  top_p: 0.6
  max_tokens: 8192
  num_ctx: 16384                 # ollama: ภาพ + prompt + output ต้องพอใน context
  timeout: 300
  max_image_side: 1800           # ย่อภาพก่อนส่ง VLM เพื่อลด token/เวลา

llm_extractor:
  # LLM ที่แปลง text/markdown → JSON ตาม schema (ใช้ใน mode=vlm หรือ --llm on)
  provider: ollama
  base_url: http://localhost:11434
  model: qwen2.5:3b
  api_key_env: LLM_API_KEY
  temperature: 0.0
  max_tokens: 4096
  num_ctx: 8192
  timeout: 300

validation:
  amount_tolerance: 0.02  # ยอมให้คลาดเคลื่อนจากการปัดเศษ (บาท)
  default_vat_rate: 0.07

# ป้ายของฟิลด์แกนกลางที่ rules อ่านค่าตามหลังป้าย (ตอนนี้: buyer.name = ชื่อลูกค้า) กลไกที่ src/fin_extractor/extraction/core_labels.py
# ใช้เฉพาะป้ายที่เห็นจริงบนสแกน (ระบุ source) ห้ามใช้คำกว้างอย่าง "ลูกค้า" เปล่า ๆ เพราะเป็นป้ายหลอก
# (สำหรับลูกค้า / For Customer, รหัสลูกค้า, Customer Tax ID) ชนิดเอกสารกำหนด core_labels ของตัวเองเพื่อทับค่าตั้งต้นที่ key เดียวกันได้
core_labels:
  - {key: buyer.name, aliases: ["ชื่อลูกค้า", "ซื่อลูกค้า", "นามลูกค้า", "นามลูกคา"], next_line_caption: true, source: "001306 (ชื่อลูกค้า), 001312 (ซื่อลูกค้า), 001308/001309/001317/001318/001319 (นามลูกค้า, OCR: นามลูกคา)"}

# โปรไฟล์ชนิดเอกสาร: กำหนดฟิลด์เฉพาะชนิด, ฟิลด์ที่ต้องมี และยอดที่ใช้ตัดสิน failed (กลไกอยู่ที่ src/fin_extractor/doctypes.py)
#
# ข้อมูลนอกเหนือจากฟิลด์แกนกลาง (vendor/buyer/date/items/ยอดเงิน...) และ fields ของโปรไฟล์ จะถูกเก็บเป็น `remark` (ป้าย + ค่า)
# เอกสารที่ไม่ตรงโปรไฟล์ใดใช้ `generic` = ใบกำกับภาษี/ใบเสร็จ/invoice เหมือนเดิมทุกประการ (ไม่ต้องประกาศ)
#
# คีย์ของแต่ละโปรไฟล์ (ทุกตัวไม่บังคับ)
#   aliases        ข้อความที่พิมพ์บนเอกสารไว้จำแนกชนิด (ตัดช่องว่าง/ตัวพิมพ์ ลำดับในไฟล์ = ลำดับความสำคัญ ตัวที่ตรงก่อนชนะ)
#   required       field ที่ชนิดนี้ต้องมี (ค่าตั้งต้น = vendor.name, vendor.tax_id, invoice_no, date, total_amount)
#                  ฟิลด์ประจำชนิดอ้างแบบ document_fields.<key>
#   primary_amount ยอดที่ถ้าหาไม่เจอแล้ว failed (ค่าตั้งต้น total_amount; null = ไม่มีกฎนี้)
#   not_applicable field ที่ชนิดนี้ไม่มี (ไม่นับเป็นหาไม่เจอ และตัดออกจาก schema ที่ส่งให้ LLM)
#   checks         ชื่อ check ที่ใช้กับชนิดนี้ (ค่าตั้งต้น = ทุกข้อ) ข้อที่ไม่ระบุจะรายงานเป็น passed=null ไม่นับผ่าน/ไม่ผ่าน
#                  ชื่อที่ใช้ได้: vendor_tax_id_checksum, buyer_tax_id_checksum, items_sum, discount, before_vat_plus_vat, vat_rate, date_range
#   fields         key / label / type (text|code|money|date|tax_id|percent) / aliases (ป้ายที่พิมพ์) / source (ป้ายนี้เห็นจากที่ไหน)
#
# สถานะ: draft — รายการฟิลด์และ required ด้านล่างมาจากป้ายที่พิมพ์บนสแกนใน data/raw/finance_doc_scan (ระบุใน source)
#        ยังไม่ได้ให้ฝ่ายบัญชียืนยัน ต้องยืนยันก่อนใช้ตัดสินจริง (docs/08 หัวข้อ 3.6)
# รูปแบบเก่า (ชื่อชนิด → not_applicable เทียบกับ data.document_type ตรง ๆ) ยังใช้ได้
document_types:
  withholding_certificate:
    title: หนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ)
    status: "draft: รอฝ่ายบัญชียืนยัน"
    aliases: ["หนังสือรับรองการหักภาษี", "50 ทวิ"]
    # ผู้ถูกหักภาษี = ผู้ที่ถูกหักเงิน (ใช้เป็น buyer) ส่วนผู้หักภาษีเป็น vendor — ร่าง รอฝ่ายบัญชียืนยัน ชื่ออยู่บรรทัดใต้ป้ายได้ (next_line)
    core_labels:
      - {key: buyer.name, aliases: ["ผู้ถูกหักภาษี ณ ที่จ่าย :"], next_line: true, source: "001307, 001311, 001321, 001323"}
    # check ที่ใช้ได้: เลขภาษี + ช่วงวันที่ (ไม่มีผลรวมรายการ/VAT/ส่วนลดแบบใบกำกับ) ข้อที่ไม่ระบุรายงานเป็น passed=null (ร่าง รอฝ่ายบัญชียืนยัน)
    checks: [vendor_tax_id_checksum, buyer_tax_id_checksum, date_range]
    # ช่องแกนกลางที่ชนิดนี้ไม่มี (ตัดออกจาก schema ที่ส่งให้ LLM กันยัดยอดจ่าย+ภาษีลง total_amount: 001323)
    not_applicable: [invoice_no, items, subtotal, discount, amount_before_vat, vat_rate, vat_amount, total_amount]
    primary_amount: document_fields.total_paid
    required: [vendor.name, vendor.tax_id, document_fields.total_paid, document_fields.total_tax_withheld]
    fields:
      - {key: certificate_no, label: เลขที่หนังสือรับรอง, type: code, aliases: ["เลขที่"], source: "001321 (เลขที่ WT...), 001311 (เลขที่ 005)"}
      # เอกสารพิมพ์ยอดจ่ายและยอดภาษีที่หักไว้บรรทัดเดียวกัน (ซ้าย=ยอดจ่าย ขวา=ภาษี) ป้ายใช้แค่ส่วนต้น เพราะ OCR สะกดส่วนท้ายเพี้ยนบ่อย (หักน้ำส่ง/หักน่ำส่ง)
      - {key: total_paid, label: รวมเงินที่จ่าย, type: money, aliases: ["รวมเงินที่จ่ายและภาษี"], nth: 0, of: 2, source: "001307, 001311, 001321, 001323"}
      - {key: total_tax_withheld, label: รวมเงินภาษีที่หักนำส่ง, type: money, aliases: ["รวมเงินที่จ่ายและภาษี"], nth: 1, of: 2, source: "001307, 001311, 001321, 001323"}
      - {key: total_tax_withheld_text, label: รวมเงินภาษีที่หักนำส่ง (ตัวอักษร), type: text, aliases: ["รวมเงินภาษีที่หักนำส่ง (ตัวอักษร)"], source: "001307"}
  customs_receipt:
    title: ใบเสร็จ/ใบสรุปค่าภาษีศุลกากรและนำเข้า
    status: "draft: รอฝ่ายบัญชียืนยัน"
    aliases: ["กรมศุลกากร", "Special Entry Number"]
    core_labels:
      - {key: buyer.name, aliases: ["ชื่อผู้นำของเข้า/ผู้ส่งของออก", "ชื่อผู้น่าของเข้า/ผู้ส่งของออก"], source: "001316 (001315 พิมพ์ Shipper/Consignee สองชื่อในบรรทัดเดียว ไม่อ่านเพราะแยกคอลัมน์ไม่ได้)"}
    # ภาษีมูลค่าเพิ่มของศุลกากรคิดจากฐาน CIF+อากร ไม่ใช่จากยอดรวม จึงไม่ใช้ check vat_rate/before_vat_plus_vat (001316 ตก vat_rate ทั้งที่ถูก)
    checks: [vendor_tax_id_checksum, buyer_tax_id_checksum, date_range]
    not_applicable: [items, subtotal, discount, amount_before_vat, total_amount]
    primary_amount: document_fields.total_charges
    required: [document_fields.entry_no, document_fields.total_charges]
    fields:
      - {key: entry_no, label: เลขที่ใบขนสินค้า / Special Entry Number, type: code, aliases: ["Special Entry Number", "เลขที่ใบขนสินค้า"], source: "001315 (Special Entry Number), 001316 (เลขที่ใบขนสินค้า)"}
      - {key: receipt_no, label: Receipt No., type: code, aliases: ["Receipt No."], source: "001315"}
      - {key: awb_no, label: MAWB / HAWB, type: code, aliases: ["MAWB Number", "Hawb No."], source: "001315, 001316"}
      - {key: import_date, label: วันที่นำเข้า/ส่งออก, type: date, aliases: ["วันที่นำเข้า/ส่งออก"], source: "001316"}
      - {key: duty, label: Duty (อากร), type: money, aliases: ["Duty"], source: "001315"}
      - {key: total_charges, label: รวมเงินทั้งสิ้น / Total Charges, type: money, aliases: ["รวมเงินทั้งสิ้น", "Total Charges"], source: "001315 (Total Charges), 001316 (รวมเงินทั้งสิ้น)"}
  payment_voucher:
    title: ใบสำคัญรับเงิน (ผู้รับเงินไม่มีใบเสร็จ)
    status: "draft: รอฝ่ายบัญชียืนยัน"
    aliases: ["ใบสำคัญรับเงิน"]
    core_labels:
      - {key: buyer.name, aliases: ["ได้รับเงินจาก"], source: "001322 (001320 ลายมือ ค่าว่าง)"}
    # ใบสำคัญรับเงินไม่มี VAT/ส่วนลด: ใช้เลขภาษี วันที่ และผลรวมรายการ
    checks: [vendor_tax_id_checksum, buyer_tax_id_checksum, items_sum, date_range]
    fields:
      - {key: amount_in_words, label: จำนวนเงินตัวอักษร, type: text, aliases: ["ตัวอักษร"], source: "001320, 001322"}
