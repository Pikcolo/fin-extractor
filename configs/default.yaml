# ค่าตั้งต้นของ pipeline — override ได้ด้วย --config <file> หรือ env (.env)

paths:
  data_dir: data            # ข้อมูลทุกอย่างอยู่ใต้นี้ โครงดู src/fin_extractor/paths.py (ไม่ commit ทั้งหมด)
  # folders: {ocr: ocr_results}   # เปลี่ยนชื่อโฟลเดอร์ระดับบนได้ (ไม่บังคับ)

loader:
  pdf_dpi: 300            # ความละเอียดตอน render PDF เป็นภาพ

# Preprocessing ชุดเดียวใช้กับตัวอ่านทุก engine — ภาพสี ไม่ binarize
# เลือกจากการวัดกับชุดสังเคราะห์ (scripts/preprocess/benchmark_preprocessing.py ลบแล้ว อยู่ในประวัติ git ถึง f6cc6eb, ผลใน docs/02-preprocessing.md)
#   - ภาพสีอ่านค่าสำคัญได้ครบ ส่วนภาพเทาทำให้ตัวตรวจจับข้อความของ Paddle ไม่เจอบรรทัดในภาพสแกนบางใบ
#   - NL-means + CLAHE ช้า (เตรียมภาพ ~5 วิ/ใบ เทียบ ~0.2 วิ) และไม่ทำให้อ่านได้มากขึ้น
preprocessing:
  min_long_side: 1600     # upscale ถ้าภาพเล็กกว่านี้ (ยังไม่ได้วัดผลของขั้นนี้ — ชุดทดสอบใหญ่กว่าเกณฑ์อยู่แล้ว)
  fix_orientation: true   # หมุน 90/180/270 ด้วยตัวจำแนกทิศทั้งหน้าของ Paddle
  deskew: true
  max_skew_angle: 15.0
  denoise: none           # none | median | nlmeans | bilateral
  clahe: false
  binarize: none          # none | otsu | adaptive | sauvola
  remove_borders: false
  keep_color: true        # Typhoon/OpenThai อ่านภาพสีได้ดีกว่า และ Paddle เสถียรกว่าภาพเทา
  # remove_streaks: true  # ลบเส้นสกปรกจากเครื่องสแกนก่อนหมุน (เจอใน 1320 1322 ผลต่อ OCR ยังไม่ได้วัด ดู docs/02)
  #                       # ไม่ใส่เป็นคีย์ตรงนี้: settings.json ของ profile เดิมจะไม่ตรงแล้วต้อง --force ทั้งชุด — เปิดด้วย --config + --profile ใหม่

# ตัวอ่านขั้น 4 (readers/): คีย์ชื่อเดียวกับ --engine (openthai | openthai21 | openthai-text | typhoon | paddle)
paddle:
  lang: th                 # → th_PP-OCRv5_mobile_rec (Paddle 3.2+)
  # ปิดตัวจำแนกทิศรายบรรทัด: มันตัดสินผิดว่าบรรทัดไทยกลับหัวแล้วหมุนกลับ
  # อ่านได้ "81-SO-EZOZ" แทน "2023-05-18" (BITKUB-001 เพี้ยน 3 จาก 28 บรรทัด)
  # ทิศของทั้งหน้าตรวจแล้วใน preprocessing (ตัวจำแนกทิศทั้งหน้าของ Paddle)
  use_angle_cls: false

# Typhoon OCR — ใช้ด้วย --engine typhoon
typhoon:
  # provider: ollama  → Ollama native API (ตั้ง num_ctx ได้)       base_url: http://localhost:11434
  # provider: openai  → OpenAI-compatible endpoint:
  #     vLLM (local)  : http://localhost:8000/v1      model: ชื่อ HF repo ที่ serve
  #     Typhoon API   : https://api.opentyphoon.ai/v1  (ตั้ง TYPHOON_API_KEY, เช็คชื่อ model ที่ docs.opentyphoon.ai)
  provider: ollama
  base_url: http://localhost:11434
  model: scb10x/typhoon-ocr1.5-3b
  api_key_env: TYPHOON_API_KEY   # ใช้เฉพาะ provider openai
  temperature: 0.1
  top_p: 0.6
  max_tokens: 8192
  num_ctx: 16384                 # ollama: ภาพ + prompt + output ต้องพอใน context
  timeout: 300
  max_image_side: 1800           # ย่อภาพก่อนส่งเพื่อลด token/เวลา

# OpenThai 2.0 OCR Markdown (iApp, Nemotron-Parse 0.63B) — ใช้ด้วย --engine openthai
# ดาวน์โหลดโมเดล: hf download iapp/OpenThai2.0-OCR-Markdown --local-dir models/OpenThai2.0-OCR-Markdown
openthai:
  backend: transformers          # transformers = โหลดในเครื่อง | vllm = เรียก server ที่ base_url
  model_dir: models/OpenThai2.0-OCR-Markdown
  device: null                   # null = cuda ถ้ามี ไม่งั้น cpu (โมเดลการ์ดแนะนำ GPU; CPU ช้ากว่ามาก)
  base_url: http://localhost:8000/v1   # ใช้เฉพาะ backend vllm
  repetition_penalty: 1.1        # ค่าตามตัวอย่างของผู้ทำโมเดล
  max_tokens: 8744
  parse_mode: single             # single = อ่านหน้าเดียวรอบเดียว | double = อ่านซ้ำเฉพาะตาราง/chart แบบ crop (ช้ากว่า แต่ลดตารางตก)

# OpenThai 2.1 OCR Markdown (iApp 2026-11-18) — ใช้ด้วย --engine openthai21 ตัวอ่านเดียวกับ openthai แค่ weights ใหม่ ผลลง 04_ocr/<dataset>/openthai21/
# ดาวน์โหลด: hf download iapp/OpenThai2.1-OCR-Markdown-20261118 --local-dir models/OpenThai2.1-OCR-Markdown-20261118
# model card: เอกสารราชการไทย/ตารางเท่าเดิม (printed Thai 90.2 เทียบ 2.0 90.3) ดีขึ้นที่ภาพถ่ายมือถือ + หน้าแบบใหม่ ยังไม่ได้วัดกับสแกนของเรา
openthai21:
  backend: transformers
  model_dir: models/OpenThai2.1-OCR-Markdown-20261118
  device: null
  base_url: http://localhost:8000/v1
  repetition_penalty: 1.1        # ค่าเดียวกับ openthai (2.0) ให้เทียบแฟร์ model card 2.1 ไม่ได้แนะนำค่าใหม่
  max_tokens: 8744
  parse_mode: single

# OpenThai 2.1 OCR Text (iApp 2026-11-18) — ใช้ด้วย --engine openthai-text ONNX บน CPU (ไม่ใช้ GPU) ต้อง pip install onnxruntime
# ดาวน์โหลด: hf download iapp/OpenThai2.1-OCR-Text-20261118 --local-dir models/OpenThai2.1-OCR-Text-20261118
# คืนบรรทัด + ความมั่นใจ ไม่มีตาราง model card: ลายมืออ่านได้แย่ (handwriting 10.3)
openthai-text:
  model_dir: models/OpenThai2.1-OCR-Text-20261118
  threads: 1                     # ตาม model card (หนึ่ง worker ต่อ core)

# ชั้นตรวจความครบของ OCR รายส่วน (sections/coverage.py) รันในขั้น ocr ของคำสั่ง sections หลังตัวอ่านหลัก (ปิด: --no-coverage-check)
# 1) ตัวอ่านเสริมอ่านภาพย่อยชุดเดียวกันบน CPU ชี้ภาพที่มียอดเงิน/วันที่/รหัสยาวที่ตัวอ่านหลักไม่เห็น
# 2) ภาพที่ถูกชี้และหาจุดแยกได้: ตัวอ่านหลัก (GPU) อ่านครึ่งซ้าย/ขวาใหม่ ใช้ผลเมื่อค่าที่ขาดลดลงเท่านั้น
# 3) ภาพที่ยังขาดยอดเงิน/วันที่: แนบข้อความของตัวอ่านเสริมต่อท้าย .md
# วัด 2026-11-25 (OpenThai regions 18 ใบ): ยอดเงินถูก 27 → 34 เลขที่ 5 → 10 วันที่ 10 → 13 ไม่มีค่าผิดเพิ่ม (docs/04-openthai-ocr.md §7)
coverage_check:
  enabled: true
  engine: openthai-text

llm_extractor:
  # LLM ที่แปลง text/markdown → JSON ตาม schema (ใช้เมื่อ --llm on/auto/hybrid)
  provider: ollama
  base_url: http://localhost:11434
  model: qwen2.5:3b
  api_key_env: LLM_API_KEY
  temperature: 0.0
  max_tokens: 4096
  num_ctx: 8192
  timeout: 300

validation:
  amount_tolerance: 0.02  # ยอมให้คลาดเคลื่อนจากการปัดเศษ (บาท)
  default_vat_rate: 0.07

# ป้ายของฟิลด์แกนกลางที่ rules อ่านค่าตามหลังป้าย (ตอนนี้: buyer.name = ชื่อลูกค้า) กลไกที่ src/fin_extractor/extraction/core_labels.py
# ใช้เฉพาะป้ายที่เห็นจริงบนสแกน (ระบุ source) ห้ามใช้คำกว้างอย่าง "ลูกค้า" เปล่า ๆ เพราะเป็นป้ายหลอก
# (สำหรับลูกค้า / For Customer, รหัสลูกค้า, Customer Tax ID) ชนิดเอกสารกำหนด core_labels ของตัวเองเพื่อทับค่าตั้งต้นที่ key เดียวกันได้
core_labels:
  - {key: buyer.name, aliases: ["ชื่อลูกค้า", "ซื่อลูกค้า", "นามลูกค้า", "นามลูกคา"], next_line_caption: true, source: "001306 (ชื่อลูกค้า), 001312 (ซื่อลูกค้า), 001308/001309/001317/001318/001319 (นามลูกค้า, OCR: นามลูกคา)"}

# ชนิดเอกสาร (``document_type``) จากคำที่พิมพ์บนหัวกระดาษ: ลำดับในไฟล์ = ลำดับความสำคัญ ตัวที่ตรงก่อนชนะ (เจาะจงก่อนกว้าง:
# "ใบกำกับภาษี" ต้องอยู่เหนือ "invoice" เพราะ tax invoice มีคำว่า invoice) เอกสารหนึ่งใบได้ชนิดเดียว ปรับ/เพิ่มชนิดที่นี่ได้เลย
# ชนิดนี้เป็นแค่ป้ายบอกชื่อเอกสาร ไม่เปลี่ยนฟิลด์/check (อันนั้นคือโปรไฟล์ด้านล่าง) ใช้เป็นตัวเลือกสำรองให้จำแนกโปรไฟล์ด้วย (doctypes.classify)
# source = ใบบนสแกนที่เห็นคำนี้ (ไม่มี = ยังไม่เคยเห็นบนสแกน 18 ใบ)
document_kinds:
  tax_invoice:
    aliases: ["ใบกำกับภาษี", "tax invoice"]
    source: "001308-001310, 001312, 001313, 001314, 001317-001319"
  receipt:
    aliases: ["ใบเสร็จ", "receipt"]
    source: "001306, 001312, 001315-001318"
  invoice:
    aliases: ["ใบแจ้งหนี้", "invoice"]
    source: "001306"
  delivery_note:
    aliases: ["ใบส่งของ", "ใบส่งสินค้า", "delivery note"]
    source: "001312 (ใบส่งของ), 001319 (ใบส่งสินค้า) อยู่หลัง tax_invoice/receipt จึงไม่ชนะใบที่มีคำเหล่านั้นด้วย"
  quotation:
    aliases: ["ใบเสนอราคา", "quotation"]

# โปรไฟล์ชนิดเอกสาร: กำหนดฟิลด์เฉพาะชนิด, ฟิลด์ที่ต้องมี และยอดที่ใช้ตัดสิน failed (กลไกอยู่ที่ src/fin_extractor/doctypes.py)
#
# ข้อมูลนอกเหนือจากฟิลด์แกนกลาง (vendor/buyer/date/items/ยอดเงิน...) และ fields ของโปรไฟล์ จะถูกเก็บเป็น `remark` (ป้าย + ค่า)
# เอกสารที่ไม่ตรงโปรไฟล์ใดใช้ `generic` = ใบกำกับภาษี/ใบเสร็จ/invoice เหมือนเดิมทุกประการ (ไม่ต้องประกาศ)
#
# คีย์ของแต่ละโปรไฟล์ (ทุกตัวไม่บังคับ)
#   aliases        ข้อความที่พิมพ์บนเอกสารไว้จำแนกชนิด (ตัดช่องว่าง/ตัวพิมพ์ ลำดับในไฟล์ = ลำดับความสำคัญ ตัวที่ตรงก่อนชนะ)
#   required       field ที่ชนิดนี้ต้องมี (ค่าตั้งต้น = vendor.name, vendor.tax_id, invoice_no, date, total_amount)
#                  ฟิลด์ประจำชนิดอ้างแบบ document_fields.<key>
#   primary_amount ยอดที่ถ้าหาไม่เจอแล้ว incomplete (ค่าตั้งต้น total_amount; null = ไม่มีกฎนี้)
#   not_applicable field ที่ชนิดนี้ไม่มี (ไม่นับเป็นหาไม่เจอ และตัดออกจาก schema ที่ส่งให้ LLM)
#   checks         ชื่อ check ที่ใช้กับชนิดนี้ (ค่าตั้งต้น = ทุกข้อ) ข้อที่ไม่ระบุจะรายงานเป็น passed=null ไม่นับผ่าน/ไม่ผ่าน
#                  ชื่อที่ใช้ได้: vendor_tax_id_checksum, buyer_tax_id_checksum, items_sum, discount, before_vat_plus_vat, vat_rate, date_range
#   fields         key / label / type (text|code|money|date|tax_id|percent) / aliases (ป้ายที่พิมพ์) / source (ป้ายนี้เห็นจากที่ไหน)
#
# รายการฟิลด์และ required ด้านล่างมาจากป้ายที่พิมพ์บนสแกนใน data/01_input/finance_doc_scan (ระบุใน source)
document_types:
  withholding_certificate:
    title: หนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ)
    aliases: ["หนังสือรับรองการหักภาษี", "50 ทวิ"]
    # ผู้มีหน้าที่หักภาษี = ผู้จ่ายเงิน = buyer · ผู้ถูกหักภาษี = ผู้รับเงิน = vendor (ผู้ขาย) ตามที่ฝ่ายบัญชียืนยัน 2026-11-27 ใช้เฉพาะชนิดนี้
    # ฟอร์มบอกฝ่ายด้วยป้ายของบล็อก (ไม่ใช่ตำแหน่ง: 001311 บริษัทเดียวกันเป็นผู้ถูกหัก ส่วน 001307/001321/001323 เป็นผู้หัก) จึงอ่านเลขภาษี/ชื่อจากในบล็อก
    # ป้ายต้องอยู่ต้นบรรทัด (บรรทัดสำเนา "ฉบับที่ 1 (สำหรับผู้ถูกหักภาษี ...)" ไม่นับ) end = หัวตารางเงินได้ที่ปิดบล็อกสุดท้าย (OCR ทำ "ลำดับที่" เหลือ "ลำดับที" ได้ 001311)
    party_blocks:
      end: ["ลำดับที", "ประเภทเงินได้"]
      vendor: {aliases: ["ผู้ถูกหักภาษี ณ ที่จ่าย"], role: "ผู้ถูกหักภาษี ณ ที่จ่าย (ผู้รับเงิน = ผู้ขาย)"}
      buyer: {aliases: ["ผู้มีหน้าที่หักภาษี ณ ที่จ่าย"], role: "ผู้มีหน้าที่หักภาษี ณ ที่จ่าย (ผู้จ่ายเงิน = ผู้ซื้อ)"}
    # check ที่ใช้ได้: เลขภาษี + ช่วงวันที่ (ไม่มีผลรวมรายการ/VAT/ส่วนลดแบบใบกำกับ) ข้อที่ไม่ระบุรายงานเป็น passed=null (ร่าง รอฝ่ายบัญชียืนยัน)
    checks: [vendor_tax_id_checksum, buyer_tax_id_checksum, date_range, amount_in_words, income_rows_sum]
    # ช่องแกนกลางที่ชนิดนี้ไม่มี (ตัดออกจาก schema ที่ส่งให้ LLM กันยัดยอดจ่าย+ภาษีลง total_amount: 001323)
    not_applicable: [invoice_no, items, subtotal, discount, amount_before_vat, vat_rate, vat_amount, total_amount]
    primary_amount: document_fields.total_paid
    # ผู้หักภาษี (ตอนนี้คือ buyer) ต้องระบุตัวตนได้ เหมือนก่อนสลับฝั่ง (เดิมคือ vendor.*) ผู้ถูกหักไม่บังคับ: ฝ่ายบัญชียังไม่ได้ระบุว่าต้องการด้วยไหม
    required: [buyer.name, buyer.tax_id, document_fields.total_paid, document_fields.total_tax_withheld]
    fields:
      - {key: certificate_no, label: เลขที่หนังสือรับรอง, type: code, aliases: ["เลขที่"], source: "001321 (เลขที่ WT...), 001311 (เลขที่ 005)"}
      # เอกสารพิมพ์ยอดจ่ายและยอดภาษีที่หักไว้บรรทัดเดียวกัน (ซ้าย=ยอดจ่าย ขวา=ภาษี) ป้ายใช้แค่ส่วนต้น เพราะ OCR สะกดส่วนท้ายเพี้ยนบ่อย (หักน้ำส่ง/หักน่ำส่ง)
      - {key: total_paid, label: รวมเงินที่จ่าย, type: money, aliases: ["รวมเงินที่จ่ายและภาษี"], nth: 0, of: 2, source: "001307, 001311, 001321, 001323"}
      - {key: total_tax_withheld, label: รวมเงินภาษีที่หักนำส่ง, type: money, aliases: ["รวมเงินที่จ่ายและภาษี"], nth: 1, of: 2, source: "001307, 001311, 001321, 001323"}
      - {key: total_tax_withheld_text, label: รวมเงินภาษีที่หักนำส่ง (ตัวอักษร), type: text, aliases: ["รวมเงินภาษีที่หักนำส่ง (ตัวอักษร)"], source: "001307", words_of: document_fields.total_tax_withheld}
  customs_receipt:
    title: ใบเสร็จ/ใบสรุปค่าภาษีศุลกากรและนำเข้า
    aliases: ["กรมศุลกากร", "Special Entry Number"]
    core_labels:
      - {key: buyer.name, aliases: ["ชื่อผู้นำของเข้า/ผู้ส่งของออก", "ชื่อผู้น่าของเข้า/ผู้ส่งของออก"], source: "001316 (001315 พิมพ์ Shipper/Consignee สองชื่อในบรรทัดเดียว ไม่อ่านเพราะแยกคอลัมน์ไม่ได้)"}
    # ภาษีมูลค่าเพิ่มของศุลกากรคิดจากฐาน CIF+อากร ไม่ใช่จากยอดรวม จึงไม่ใช้ check vat_rate/before_vat_plus_vat (001316 ตก vat_rate ทั้งที่ถูก)
    checks: [vendor_tax_id_checksum, buyer_tax_id_checksum, date_range]
    not_applicable: [items, subtotal, discount, amount_before_vat, total_amount]
    primary_amount: document_fields.total_charges
    required: [document_fields.entry_no, document_fields.total_charges]
    fields:
